# PRE-RUN Configuration
# All thresholds and weights are tunable here — never hardcode them in src/.

model_version: "PRE-RUN v1.0"

# ----------------------------------------------------------------------------
# UNIVERSE
# ----------------------------------------------------------------------------
universe:
  mode: "normal"            # "normal" or "aggressive"
  normal:
    min_price: 2.0
    min_avg_dollar_volume: 5_000_000
    min_avg_volume: 500_000
    exclude_otc: true
    exclude_leveraged_etf: true
    exclude_inverse_etf: true
    exclude_preferred: true
    min_history_days: 260   # ~1 trading year required before a ticker is scored
  aggressive:
    min_price: 0.50
    min_avg_dollar_volume: 1_000_000
    min_avg_volume: 100_000
    exclude_otc: false
    exclude_leveraged_etf: true
    exclude_inverse_etf: true
    exclude_preferred: false
    min_history_days: 120
  # Starter list. Meant to be swapped for a full exchange listing file
  # (see scripts/build_universe.py) — this is intentionally small so the
  # first backtest runs fast.
  seed_tickers:
    - AAPL
    - MSFT
    - NVDA
    - AMD
    - TSLA
    - PLTR
    - SOFI
    - RIVN
    - COIN
    - MARA
    - RIOT
    - SMCI
    - CELH
    - CVNA
    - AFRM
    - UPST
    - IONQ
    - RKLB
    - ENVX
    - SPY
    - QQQ
    - IWM

benchmarks:
  market: SPY
  tech_growth: QQQ
  small_cap: IWM
  vix_proxy: "^VIX"

sector_etfs:
  Technology: XLK
  Financials: XLF
  Energy: XLE
  Industrials: XLI
  Healthcare: XLV
  Consumer Discretionary: XLY
  Consumer Staples: XLP
  Utilities: XLU
  Materials: XLB
  Real Estate: XLRE
  Communication Services: XLC

# ----------------------------------------------------------------------------
# PRE-RUN SCORE WEIGHTS (must sum to 100)
# ----------------------------------------------------------------------------
weights:
  momentum_structure: 15
  volume_accumulation: 20
  volatility_compression: 10
  breakout_proximity: 15
  catalyst: 15
  options_activity: 10
  short_interest: 5
  insider_activity: 5
  news_attention: 5
  # total = 100

# Components with no free reliable data source in Phase 1-6.
# These are computed as N/A until the corresponding Phase (7-9) is built,
# and are EXCLUDED from the score denominator (see scoring/prerun_score.py)
# rather than assigned a fake value.
unavailable_in_phase1: [catalyst, options_activity, short_interest, insider_activity, news_attention]

classification_bands:
  NO_SETUP: [0, 49]
  WATCH: [50, 64]
  EARLY: [65, 74]
  SETUP: [75, 84]
  IMMINENT: [85, 94]
  EXTREME_SETUP: [95, 100]

already_running:
  return_3d_threshold: 0.15    # +15% in 3 days -> flagged ALREADY_RUNNING
  return_5d_threshold: 0.20    # +20% in 5 days -> flagged ALREADY_RUNNING

# ----------------------------------------------------------------------------
# RUN DEFINITIONS (forward outcome labels — see backtesting/definitions.py)
# ----------------------------------------------------------------------------
run_definitions:
  RUN_1: {move: 0.05, days: 5}
  RUN_2: {move: 0.10, days: 5}
  RUN_3: {move: 0.15, days: 10}
  RUN_4: {move: 0.20, days: 20}
  RUN_5: {move: 0.30, days: 20}

forward_windows_days: [1, 3, 5, 10, 20]

# ----------------------------------------------------------------------------
# BACKTEST / COSTS
# ----------------------------------------------------------------------------
transaction_costs:
  commission: 0.0
  slippage_bps:
    liquid: 5       # 0.05%
    small: 20        # 0.20%
    illiquid: 50      # 0.50%+
  liquid_dollar_volume_threshold: 20_000_000
  illiquid_dollar_volume_threshold: 2_000_000

# ----------------------------------------------------------------------------
# ACCOUNTS / POSITION SIZING
# ----------------------------------------------------------------------------
accounts:
  default: 2000
  sizes: [2000, 5000, 10000, 25000]
  risk_per_trade_options: [0.005, 0.01, 0.02]
  default_risk_per_trade: 0.01
  whole_shares_only: true
  max_positions_per_sector: 2

# ----------------------------------------------------------------------------
# BREAKOUT / TRIGGER
# ----------------------------------------------------------------------------
breakout:
  prerun_min_score: 75
  volume_confirmation_multiple: 1.5

# ----------------------------------------------------------------------------
# SIGNAL DECAY
# ----------------------------------------------------------------------------
signal_decay_days: [5, 10, 20]

# ----------------------------------------------------------------------------
# DATA REFRESH CADENCE (see src/data/cache.py)
# ----------------------------------------------------------------------------
refresh:
  prices_days: 1
  fundamentals_days: 7
  sec_filings_days: 1
  news_hours: 6

database:
  path: "data/database/pre_run.db"
